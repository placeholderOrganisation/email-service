<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>email-service admin</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0b0d12; --panel: #14171f; --border: #262b36; --text: #e6e9ef;
    --muted: #8b93a3; --accent: #6c8cff; --danger: #ff6b6b; --ok: #4ade80; --warn: #fbbf24;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f6f8; --panel: #ffffff; --border: #e2e5ea; --text: #1a1d24; --muted: #6b7280; }
  }
  * { box-sizing: border-box; }
  /* The hidden attribute must win over component display rules (e.g. .gate
     sets display:flex, which otherwise keeps the login box on screen after
     auth). This one line is what makes show/hide actually work. */
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px;
           border-bottom: 1px solid var(--border); }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  header .dot.ok { background: var(--ok); }
  header .dot.bad { background: var(--danger); }
  button, select, input[type=text], input[type=email], input[type=password], textarea {
    font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px;
  }
  textarea { width: 100%; resize: vertical; min-height: 160px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  input[type=text], input[type=email], input[type=password], select { width: 100%; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button.danger:hover { background: var(--danger); color: #fff; }
  button.sm { padding: 3px 8px; font-size: 12px; }
  a { color: var(--accent); }
  .layout {
    display: grid;
    grid-template-columns: var(--col-projects, 240px) 5px var(--col-mid, 560px) 5px minmax(280px, 1fr);
    height: calc(100vh - 49px);
  }
  .col { overflow-y: auto; padding: 10px; min-width: 0; }
  .gutter { cursor: col-resize; background: var(--border); }
  .gutter:hover, .gutter.dragging { background: var(--accent); }
  body.col-resizing { cursor: col-resize; user-select: none; }
  .item { padding: 8px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 2px; }
  .item:hover { background: var(--panel); }
  .item.active { background: var(--accent); color: #fff; }
  .item .sub { font-size: 12px; color: var(--muted); }
  .item.active .sub { color: #dde4ff; }
  .col-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .col-head .title { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; }
  tr.row { cursor: pointer; }
  tr.row:hover { background: var(--panel); }
  #review-list-wrap th:first-child, #review-list-wrap td:first-child { width: 28px; padding-right: 4px; }
  input[type=checkbox] { cursor: pointer; accent-color: var(--accent); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.sent { background: rgba(74,222,128,.15); color: var(--ok); }
  .badge.failed { background: rgba(255,107,107,.15); color: var(--danger); }
  .badge.queued, .badge.processing { background: rgba(251,191,36,.15); color: var(--warn); }
  .badge.on { background: rgba(74,222,128,.15); color: var(--ok); }
  .badge.off { background: rgba(139,147,163,.2); color: var(--muted); }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); padding: 20px; text-align: center; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 4px; font-size: 14px; }
  .card .row-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .tmpl-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px; }
  .tmpl-row:hover { background: var(--panel); }
  .tmpl-row .grow { flex: 1; cursor: pointer; min-width: 0; }
  .tmpl-row .grow .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gate { display: flex; align-items: center; justify-content: center; height: 100vh; }
  .gate form { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
               padding: 28px; width: 320px; display: flex; flex-direction: column; gap: 10px; }
  .gate h2 { margin: 0 0 4px; font-size: 16px; }
  .gate .err { color: var(--danger); font-size: 13px; min-height: 18px; }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--panel);
        border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-size: 12px; }
  .detail dl { display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; margin: 0 0 16px; }
  .detail dt { color: var(--muted); }
  .detail dt, .detail dd { margin: 0; font-size: 13px; word-break: break-word; }
  code { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex;
             align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .modal { background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
           width: 520px; max-width: 100%; max-height: 90vh; overflow-y: auto; padding: 20px; }
  .modal h2 { margin: 0 0 14px; font-size: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 13px; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  .modal .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 4px; }
  .keybox { display: flex; gap: 8px; align-items: center; }
  .keybox code { flex: 1; overflow-x: auto; white-space: nowrap; padding: 8px; }
</style>
</head>
<body>

<div id="gate" class="gate" hidden>
  <form id="gate-form">
    <h2>email-service admin</h2>
    <p class="muted" style="margin:0 0 6px">Enter the admin token (set as <code>ADMIN_TOKEN</code> on the server).</p>
    <input id="token-input" type="password" placeholder="Admin token" autofocus />
    <button class="primary" type="submit">Unlock</button>
    <div class="err" id="gate-err"></div>
  </form>
</div>

<div id="app" hidden>
  <header>
    <span class="dot" id="health-dot"></span>
    <h1>email-service admin</h1>
    <button id="refresh-btn">Refresh</button>
    <button id="reset-cols-btn" title="Reset column widths">Reset layout</button>
    <button id="logout-btn">Lock</button>
  </header>
  <div class="layout" id="layout">
    <div class="col" id="projects-col"></div>
    <div class="gutter" data-col="projects" title="Drag to resize"></div>
    <div class="col" id="mid-col"></div>
    <div class="gutter" data-col="mid" title="Drag to resize"></div>
    <div class="col" id="detail-col"></div>
  </div>
</div>

<div id="modal-root"></div>

<script>
(function () {
  const $ = (sel, elm) => (elm || document).querySelector(sel);
  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null) continue;
      if (k === "text") n.textContent = v;
      else if (k === "html") n.innerHTML = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    }
    kids.flat().forEach((k) => k != null && n.append(k));
    return n;
  };
  const fmtDate = (d) => (d ? new Date(d).toLocaleString() : "—");

  // Map the four review lifecycle status dimensions onto the existing .badge
  // color classes: green (on/sent) = good/done, amber (queued) = in progress,
  // red (failed) = error, grey (off) = neutral/waiting.
  const REVIEW_BADGE = {
    ready: "on", approved: "on", posted: "sent",
    failed: "failed",
    processing: "queued", generating: "queued", draft: "queued",
    pending: "off", awaiting_client: "off", unpublished: "off",
  };
  const badgeFor = (s) => "badge " + (REVIEW_BADGE[s] || "off");
  const snippet = (t, n) => { t = (t || "").trim(); return t.length > (n || 60) ? t.slice(0, n || 60) + "…" : t; };

  // A single labelled form field (mirrors openForm's .field markup) for the
  // custom import modal, which needs conditional single/bulk sections.
  const field = (label, input, help) =>
    el("div", { class: "field" },
      el("label", {}, label), input,
      help ? el("div", { class: "muted", style: "font-size:12px;margin-top:2px", text: help }) : null);

  const state = { token: localStorage.getItem("es_admin_token") || "", projectId: null, section: "emails", view: "project", data: null };

  async function api(path, opts) {
    opts = opts || {};
    const headers = { "X-Admin-Token": state.token };
    if (opts.body) headers["Content-Type"] = "application/json";
    const res = await fetch(path, {
      method: opts.method || "GET",
      cache: "no-store",
      headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    if (res.status === 401) { unlock(false); throw new Error("Unauthorized"); }
    if (res.status === 204) return null;
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error || res.statusText);
    return json;
  }

  function unlock(ok) {
    $("#gate").hidden = ok;
    $("#app").hidden = !ok;
    if (ok) {
      cols = clampCols(cols);
      applyCols(cols);
    }
  }

  // ---------- Modal form ----------
  // Each modal owns its overlay node and removes only itself, so a follow-up
  // modal (e.g. the API-key dialog after "create project") can stack without the
  // form's close wiping it out.
  function closeModal() { $("#modal-root").replaceChildren(); }

  // fields: [{ key, label, type, options, value, required, help, disabled }]
  function openForm({ title, fields, submitLabel, onSubmit }) {
    const inputs = {};
    const form = el("form");
    for (const f of fields) {
      let input;
      if (f.type === "textarea") input = el("textarea", { id: "f_" + f.key });
      else if (f.type === "select")
        input = el("select", { id: "f_" + f.key }, ...f.options.map((o) => el("option", { value: o }, o)));
      else if (f.type === "checkbox") input = el("input", { type: "checkbox", id: "f_" + f.key });
      else input = el("input", { type: f.type || "text", id: "f_" + f.key });
      if (f.type === "checkbox") input.checked = Boolean(f.value);
      else if (f.value != null) input.value = f.value;
      if (f.disabled) input.disabled = true;
      inputs[f.key] = input;
      form.append(
        el("div", { class: "field" },
          el("label", { for: "f_" + f.key, text: f.label }),
          input,
          f.help ? el("div", { class: "muted", style: "font-size:12px;margin-top:2px", text: f.help }) : null,
        ),
      );
    }
    const err = el("div", { class: "err" });
    const submitBtn = el("button", { class: "primary", type: "submit", text: submitLabel || "Save" });
    const ov = el("div", { class: "overlay", onclick: (e) => e.target === ov && ov.remove() },
      el("div", { class: "modal" }, el("h2", { text: title }), form));
    form.append(err, el("div", { class: "actions" },
      el("button", { type: "button", text: "Cancel", onclick: () => ov.remove() }), submitBtn));

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const values = {};
      for (const f of fields) values[f.key] = f.type === "checkbox" ? inputs[f.key].checked : inputs[f.key].value;
      err.textContent = "";
      submitBtn.disabled = true;
      try { await onSubmit(values); ov.remove(); }
      catch (ex) { err.textContent = ex.message || "Something went wrong"; submitBtn.disabled = false; }
    });

    $("#modal-root").append(ov);
    const first = form.querySelector("input, textarea, select");
    if (first) first.focus();
  }

  function showKey(title, plaintext) {
    const ov = el("div", { class: "overlay" },
      el("div", { class: "modal" },
        el("h2", { text: title }),
        el("p", { class: "muted", text: "Copy this now — it is shown only once and cannot be retrieved later." }),
        el("div", { class: "keybox" }, el("code", { text: plaintext }),
          el("button", { text: "Copy", onclick: () => navigator.clipboard.writeText(plaintext) })),
        el("div", { class: "actions" }, el("button", { class: "primary", text: "Done", onclick: () => ov.remove() }))));
    $("#modal-root").append(ov);
  }

  // ---------- Gate ----------
  $("#gate-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const val = $("#token-input").value.trim();
    if (!val) return;
    state.token = val;
    try {
      await api("/admin/api/projects");
      localStorage.setItem("es_admin_token", val);
      unlock(true); loadProjects(); checkHealth();
    } catch { $("#gate-err").textContent = "Invalid token."; }
  });
  $("#logout-btn").addEventListener("click", () => {
    localStorage.removeItem("es_admin_token"); state.token = ""; unlock(false);
  });
  $("#refresh-btn").addEventListener("click", () => {
    loadProjects(); if (state.projectId) selectProject(state.projectId); checkHealth();
  });

  const COLS_KEY = "es_admin_cols";
  const COL_DEFAULTS = { projects: 240, mid: 560 };
  const COL_MIN = { projects: 160, mid: 280, detail: 280 };
  const COL_MAX = { projects: 420, mid: 900 };
  let cols = loadCols();

  function loadCols() {
    try {
      const saved = JSON.parse(localStorage.getItem(COLS_KEY) || "null");
      return { ...COL_DEFAULTS, ...(saved && typeof saved === "object" ? saved : {}) };
    } catch {
      return { ...COL_DEFAULTS };
    }
  }

  function applyCols(cols) {
    const layout = $("#layout");
    layout.style.setProperty("--col-projects", Math.round(cols.projects) + "px");
    layout.style.setProperty("--col-mid", Math.round(cols.mid) + "px");
  }

  function clampCols(cols) {
    const next = {
      projects: Math.max(COL_MIN.projects, Math.min(COL_MAX.projects, Number(cols.projects) || COL_DEFAULTS.projects)),
      mid: Math.max(COL_MIN.mid, Math.min(COL_MAX.mid, Number(cols.mid) || COL_DEFAULTS.mid)),
    };
    const gutters = 10;
    const layoutW = $("#layout").clientWidth;
    // #app is hidden until unlock, so clientWidth is 0 at boot — skip viewport clamp then.
    if (layoutW < COL_MIN.projects + COL_MIN.mid + COL_MIN.detail + gutters) return next;
    const maxMid = layoutW - next.projects - gutters - COL_MIN.detail;
    next.mid = Math.max(COL_MIN.mid, Math.min(next.mid, maxMid));
    const maxProjects = layoutW - next.mid - gutters - COL_MIN.detail;
    next.projects = Math.max(COL_MIN.projects, Math.min(next.projects, maxProjects));
    return next;
  }

  function initSplitters() {
    cols = clampCols(cols);
    applyCols(cols);
    document.querySelectorAll(".gutter").forEach((gutter) => {
      gutter.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        const which = gutter.getAttribute("data-col");
        const startX = e.clientX;
        const startW = cols[which];
        gutter.classList.add("dragging");
        document.body.classList.add("col-resizing");
        const onMove = (ev) => {
          cols[which] = startW + (ev.clientX - startX);
          cols = clampCols(cols);
          applyCols(cols);
        };
        const onUp = () => {
          gutter.classList.remove("dragging");
          document.body.classList.remove("col-resizing");
          window.removeEventListener("pointermove", onMove);
          window.removeEventListener("pointerup", onUp);
          localStorage.setItem(COLS_KEY, JSON.stringify(cols));
        };
        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", onUp);
      });
    });
    window.addEventListener("resize", () => {
      cols = clampCols(cols);
      applyCols(cols);
    });
    $("#reset-cols-btn").addEventListener("click", () => {
      cols = clampCols({ ...COL_DEFAULTS });
      applyCols(cols);
      localStorage.setItem(COLS_KEY, JSON.stringify(cols));
    });
  }
  initSplitters();

  async function checkHealth() {
    const dot = $("#health-dot");
    try {
      const body = await (await fetch("/health", { cache: "no-store" })).json();
      dot.className = "dot " + (body.ok ? "ok" : "bad");
      dot.title = body.ok ? "DB connected" : "DB disconnected";
    } catch { dot.className = "dot bad"; dot.title = "unreachable"; }
  }

  // ---------- Projects column ----------
  async function loadProjects() {
    const col = $("#projects-col");
    col.replaceChildren(
      el("div", { class: "col-head" },
        el("span", { class: "title", text: "Projects" }),
        el("button", { class: "sm primary", text: "+ New", onclick: newProject })));
    // Cross-project posting queue — sits above the project list so the operator
    // can jump straight to the weekly "post approved replies to Google" workflow.
    col.append(el("div",
      { class: "item" + (state.view === "global" ? " active" : ""), onclick: selectGlobalApproved },
      el("div", { text: "★ All approved replies" }),
      el("div", { class: "sub", text: "Cross-project posting queue" })));
    let projects;
    try { projects = await api("/admin/api/projects"); } catch { return; }
    if (!projects.length) { col.append(el("div", { class: "empty", text: "No projects yet." })); return; }
    for (const p of projects) {
      col.append(el("div",
        { class: "item" + (p._id === state.projectId && state.view === "project" ? " active" : ""), onclick: () => selectProject(p._id) },
        el("div", { text: p.name }),
        el("div", { class: "sub", text: (p.fromAddress || "no sender") + (p.active ? "" : " · inactive") })));
    }
  }

  function newProject() {
    openForm({
      title: "New project",
      fields: [
        { key: "name", label: "Name", required: true },
        { key: "fromAddress", label: "From address", type: "email", help: "Must be on a domain verified in SES." },
        { key: "fromName", label: "From name (optional)" },
      ],
      submitLabel: "Create",
      onSubmit: async (v) => {
        const res = await api("/admin/api/projects", { method: "POST", body: v });
        await loadProjects();
        await selectProject(res.project._id);
        showKey("API key for " + res.project.name, res.apiKey);
      },
    });
  }

  function editProject(p) {
    openForm({
      title: "Edit project",
      fields: [
        { key: "name", label: "Name", value: p.name },
        { key: "fromAddress", label: "From address", type: "email", value: p.fromAddress },
        { key: "fromName", label: "From name", value: p.fromName || "" },
        { key: "active", label: "Active", type: "checkbox", value: p.active },
      ],
      submitLabel: "Save",
      onSubmit: async (v) => {
        await api("/admin/api/projects/" + p._id, { method: "PATCH", body: v });
        await loadProjects(); await selectProject(p._id);
      },
    });
  }

  async function rotateKey(p) {
    if (!confirm(`Rotate the API key for "${p.name}"? The current key stops working immediately.`)) return;
    const res = await api("/admin/api/projects/" + p._id + "/rotate-key", { method: "POST", body: {} });
    showKey("New API key for " + p.name, res.apiKey);
  }

  async function deleteProject(p) {
    if (!confirm(`Delete "${p.name}" and ALL its templates, forms and send history? This cannot be undone.`)) return;
    await api("/admin/api/projects/" + p._id, { method: "DELETE" });
    state.projectId = null; state.data = null;
    $("#mid-col").replaceChildren(el("div", { class: "empty", text: "Select a project." }));
    $("#detail-col").replaceChildren();
    await loadProjects();
  }

  // ---------- Middle column ----------
  const PROJECT_SECTIONS = ["emails", "reviews", "approved", "templates", "forms"];

  async function selectProject(id) {
    state.projectId = id;
    state.view = "project";
    if (!PROJECT_SECTIONS.includes(state.section)) state.section = "emails";
    await loadProjects();
    try { state.data = await api("/admin/api/projects/" + id); } catch { return; }
    renderMid();
  }

  function renderMid() {
    const col = $("#mid-col");
    col.replaceChildren();
    if (!state.data) { col.append(el("div", { class: "empty", text: "Select a project." })); return; }
    const p = state.data.project;

    col.append(el("div", { class: "card" },
      el("h3", { text: p.name }),
      el("div", { class: "sub muted", text: p.fromName ? `${p.fromName} <${p.fromAddress}>` : p.fromAddress }),
      el("div", { class: "sub muted", text: `key ••••${p.apiKeyLast4} · ` }, el("span", { class: "badge " + (p.active ? "on" : "off"), text: p.active ? "active" : "inactive" })),
      el("div", { class: "row-actions" },
        el("button", { class: "sm", text: "Edit", onclick: () => editProject(p) }),
        el("button", { class: "sm", text: "Rotate key", onclick: () => rotateKey(p) }),
        el("button", { class: "sm danger", text: "Delete", onclick: () => deleteProject(p) }))));

    const nav = el("div", { class: "toolbar" });
    for (const s of PROJECT_SECTIONS)
      nav.append(el("button", { class: "sm" + (s === state.section ? " primary" : ""),
        onclick: () => { state.section = s; renderMid(); }, text: s[0].toUpperCase() + s.slice(1) }));
    col.append(nav);

    if (state.section === "templates") renderTemplates(col);
    else if (state.section === "forms") renderForms(col);
    else if (state.section === "reviews") renderReviews(col);
    else if (state.section === "approved") renderApproved(col);
    else renderEmails(col);
  }

  function renderTemplates(col) {
    col.append(el("div", { class: "col-head" },
      el("span", { class: "title", text: `${state.data.templates.length} template(s)` }),
      el("button", { class: "sm primary", text: "+ New", onclick: newTemplate })));
    if (!state.data.templates.length) { col.append(el("div", { class: "empty", text: "None yet." })); return; }
    for (const t of state.data.templates) {
      col.append(el("div", { class: "tmpl-row" },
        el("div", { class: "grow", onclick: () => showTemplate(t) },
          el("div", { text: t.name }),
          el("div", { class: "sub", text: `${t.format} · "${t.subject}"` })),

  // ---------- Google reviews HTML paste importer (client-side) ----------
  // The operator copies a review container's HTML from DevTools ("Copy element")
  // and pastes it here; we parse it in-browser with DOMParser. We deliberately
  // AVOID Google's minified class names (they rotate often). Every field is read
  // via an ordered list of strategies that lean first on functional data
  // attributes and the accessibility tree, and only fall back to class names as
  // a last resort. If Google changes their markup, edit STRATEGIES below.

  const REL_AGE_RE = /(?:edited\s+)?\b(a|an|\d+)\s+(second|minute|hour|day|week|month|year)s?\s+ago\b/i;
  const norm = (s) => (s || "").replace(/\s+/g, " ").trim();

  // Convert a Google relative age ("3 months ago", "a year ago", "Edited 2
  // weeks ago") into an approximate Date. Deterministic; the only date source we
  // trust from a paste.
  function relativeAgeToDate(str) {
    const m = (str || "").match(REL_AGE_RE);
    if (!m) return null;
    const n = /^an?$/i.test(m[1]) ? 1 : parseInt(m[1], 10);
    if (!Number.isFinite(n)) return null;
    const d = new Date();
    switch (m[2].toLowerCase()) {
      case "second": d.setSeconds(d.getSeconds() - n); break;
      case "minute": d.setMinutes(d.getMinutes() - n); break;
      case "hour": d.setHours(d.getHours() - n); break;
      case "day": d.setDate(d.getDate() - n); break;
      case "week": d.setDate(d.getDate() - 7 * n); break;
      case "month": d.setMonth(d.getMonth() - n); break;
      case "year": d.setFullYear(d.getFullYear() - n); break;
      default: return null;
    }
    return d;
  }

  function hasAncestorWithReviewId(node, id) {
    let p = node.parentElement;
    while (p) { if (p.getAttribute && p.getAttribute("data-review-id") === id) return true; p = p.parentElement; }
    return false;
  }

  // Smallest element whose own text (no element children) matches `re`.
  function findLeafByText(root, re) {
    for (const n of root.querySelectorAll("*")) {
      if (n.childElementCount === 0 && re.test(norm(n.textContent))) return n;
    }
    return null;
  }

  // First leaf relative-age string in `root`, skipping anything inside `exclude`.
  function firstRelAge(root, exclude) {
    for (const n of root.querySelectorAll("*")) {
      if (exclude && exclude.contains(n)) continue;
      if (n.childElementCount === 0) {
        const t = norm(n.textContent);
        if (REL_AGE_RE.test(t)) return t;
      }
    }
    return "";
  }

  // Owner-response subtree, anchored on the stable literal label rather than a
  // class. Returns the container element that holds both the "Response from the
  // owner" title and the response body, or null.
  function findOwnerRoot(block) {
    const title = findLeafByText(block, /^response from the owner/i);
    if (!title) return null;
    let cur = title.parentElement;
    for (let i = 0; i < 5 && cur && cur !== block; i++) {
      if (ownerBodyWithin(cur, title)) return cur;
      cur = cur.parentElement;
    }
    return title.parentElement || null;
  }

  function ownerBodyWithin(container, title) {
    let best = null;
    for (const n of container.querySelectorAll("[lang], span, div")) {
      if (title.contains(n) || n.contains(title) || n.childElementCount > 3) continue;
      const t = norm(n.textContent);
      if (!t || /^response from the owner$/i.test(t)) continue;
      if (REL_AGE_RE.test(t) && t.length < 40) continue; // a bare date line
      if (!best || t.length > norm(best.textContent).length) best = n;
    }
    return best;
  }

  function extractOwnerResponse(block, ownerRoot) {
    if (!ownerRoot) return null;
    const title = findLeafByText(ownerRoot, /^response from the owner/i) || ownerRoot;
    const body = ownerBodyWithin(ownerRoot, title);
    const text = body ? norm(body.textContent) : "";
    if (!text) return null;
    const postedAt = relativeAgeToDate(firstRelAge(ownerRoot));
    return { text, postedAt: postedAt ? postedAt.toISOString() : "" };
  }

  // --- Field extractor helpers (attribute/ARIA-first) ---
  function ariaStars(block, sel) {
    for (const n of block.querySelectorAll(sel)) {
      const m = (n.getAttribute("aria-label") || "").match(/(\d(?:\.\d)?)\s*stars?/i);
      if (m) { const v = Math.round(parseFloat(m[1])); if (v >= 1 && v <= 5) return v; }
    }
    return null;
  }
  function cleanName(s) {
    s = norm(s);
    return s && !/stars?|\bago\b|response from the owner|photo of/i.test(s) ? s : null;
  }
  function photoOf(block) {
    const n = block.querySelector('[aria-label^="Photo of" i]');
    const m = n && n.getAttribute("aria-label").match(/photo of\s+(.+)/i);
    return m ? norm(m[1]) : null;
  }
  function contribName(block) {
    const n = block.querySelector('a[data-href*="/maps/contrib/"], button[data-href*="/maps/contrib/"]');
    if (!n) return null;
    const t = norm(n.getAttribute("aria-label") || n.textContent).replace(/^photo of\s+/i, "");
    return t || null;
  }
  function textOf(n) { return n ? (norm(n.textContent) || null) : null; }
  // Longest leaf-ish text among `nodes`, skipping the owner-response subtree.
  function longestText(nodes, ownerRoot) {
    let best = "";
    for (const n of nodes) {
      if (ownerRoot && ownerRoot.contains(n)) continue;
      if (n.childElementCount > 2) continue;
      const t = norm(n.textContent);
      if (/^response from the owner/i.test(t)) continue;
      if (t.length > best.length) best = t;
    }
    return best || null;
  }

  // Ordered strategies per field: first non-empty wins. Attribute/ARIA/text
  // first, Google's rotating class names only as a last resort. Edit here if
  // Google changes their markup.
  const STRATEGIES = {
    rating: [
      (b) => ariaStars(b, '[role="img"][aria-label]'),
      (b) => ariaStars(b, "[aria-label]"),
    ],
    author: [
      (b) => cleanName(b.getAttribute("aria-label")),
      (b) => photoOf(b),
      (b) => contribName(b),
      (b) => textOf(b.querySelector(".d4r55")), // class fallback
    ],
    date: [
      (b, ctx) => firstRelAge(b, ctx.ownerRoot),
    ],
    text: [
      (b, ctx) => longestText(b.querySelectorAll("[lang]"), ctx.ownerRoot),
      (b, ctx) => longestText(b.querySelectorAll(".wiI7pd"), ctx.ownerRoot), // class fallback
    ],
    truncated: [
      (b, ctx) => {
        const btn = b.querySelector('button[aria-label="See more" i], [aria-label="See more" i], [jsaction*="expandReview"]');
        return !!(btn && (!ctx.ownerRoot || !ctx.ownerRoot.contains(btn)));
      },
    ],
  };

  function firstHit(block, strategies, ctx) {
    for (const fn of strategies) {
      try { const v = fn(block, ctx || {}); if (v != null && v !== "") return v; } catch (_) { /* try next */ }
    }
    return null;
  }

  // Parse the copied HTML into editable review candidates. Blocks are anchored
  // on the stable [data-review-id] (also our externalReviewId for dedupe).
  function parseGoogleReviewsHtml(html) {
    const doc = new DOMParser().parseFromString(html || "", "text/html");
    const blocks = [];
    const seen = new Set();
    for (const node of doc.querySelectorAll("[data-review-id]")) {
      const id = node.getAttribute("data-review-id");
      if (!id || seen.has(id) || hasAncestorWithReviewId(node, id)) continue;
      seen.add(id);
      blocks.push(node);
    }
    return blocks.map((block) => {
      const ownerRoot = findOwnerRoot(block);
      const ctx = { ownerRoot };
      const rating = firstHit(block, STRATEGIES.rating, ctx);
      const author = firstHit(block, STRATEGIES.author, ctx) || "";
      const reviewedAt = relativeAgeToDate(firstHit(block, STRATEGIES.date, ctx));
      const text = norm(firstHit(block, STRATEGIES.text, ctx) || "");
      const truncated = firstHit(block, STRATEGIES.truncated, ctx) || false;
      return {
        externalReviewId: block.getAttribute("data-review-id"),
        author,
        rating: rating || null,
        reviewedAt: reviewedAt ? reviewedAt.toISOString() : "",
        text,
        truncated,
        ownerResponse: extractOwnerResponse(block, ownerRoot),
        flags: { missingRating: !(rating >= 1 && rating <= 5), missingText: !text },
      };
    });
  }

  // Render the parse-health banner + an editable preview card per candidate.
  // Returns an array of row handles the import submit reads edited values from.
  function renderHtmlPreview(healthBox, previewWrap, list) {
    healthBox.replaceChildren();
    previewWrap.replaceChildren();
    const total = list.length;

    if (total === 0) {
      healthBox.append(el("div", { class: "card", style: "border-color:var(--danger)" },
        el("div", { style: "color:var(--danger);font-weight:600", text: "No reviews found in the pasted HTML" }),
        el("div", { class: "muted", style: "font-size:12px;margin-top:4px",
          text: "Make sure you copied a container that includes review elements (they carry a data-review-id). If you did, Google may have changed their markup and the parser selectors need updating." })));
      return [];
    }

    const missingRating = list.filter((c) => c.flags.missingRating).length;
    const missingText = list.filter((c) => c.flags.missingText).length;
    const bits = [`Parsed ${total} review${total === 1 ? "" : "s"}`];
    if (missingRating) bits.push(`${missingRating} missing rating`);
    if (missingText) bits.push(`${missingText} without text`); // rating-only reviews are valid
    // A rating that can't be read is a genuine parse failure; missing text is a
    // legitimate state (rating-only reviews), so it never triggers this warning.
    const highMiss = missingRating > total / 2;
    healthBox.append(el("div", { class: "card", style: highMiss ? "border-color:var(--warn)" : "" },
      el("div", { style: "font-weight:600", text: bits.join(" · ") }),
      highMiss ? el("div", { class: "muted", style: "font-size:12px;margin-top:4px",
        text: "Many rows are missing a rating — Google's layout may have changed. Check each row before importing." }) : null,
      el("div", { class: "muted", style: "font-size:12px;margin-top:4px",
        text: "Ratings are pre-filled from the HTML but editable. Rating-only reviews (no text) can be imported too. Uncheck any row you don't want." })));

    const rows = [];
    for (const cand of list) {
      const check = el("input", { type: "checkbox" }); check.checked = true;
      const nameIn2 = el("input", { type: "text" }); nameIn2.value = cand.author || "";
      const ratingSel = el("select", {}, el("option", { value: "" }, "—"),
        ...[5, 4, 3, 2, 1].map((n) => el("option", { value: n }, `${n}`)));
      ratingSel.value = cand.rating ? String(cand.rating) : "";
      const dateIn2 = el("input", { type: "date" }); dateIn2.value = cand.reviewedAt ? cand.reviewedAt.slice(0, 10) : "";
      const textIn2 = el("textarea", { style: "min-height:60px" }); textIn2.value = cand.text || "";

      const badges = [];
      if (cand.flags.missingRating) badges.push(el("span", { class: "badge queued", text: "needs rating" }));
      if (cand.flags.missingText) badges.push(el("span", { class: "badge off", text: "no text" }));
      if (cand.truncated) badges.push(el("span", { class: "badge queued", text: "truncated" }));
      if (cand.ownerResponse) badges.push(el("span", { class: "badge on", text: "has owner reply" }));

      const kids = [
        el("div", { style: "display:flex;align-items:center;gap:8px;flex-wrap:wrap" },
          check,
          el("div", { style: "flex:1;min-width:140px" }, nameIn2),
          el("div", { style: "width:64px" }, ratingSel),
          el("div", { style: "width:150px" }, dateIn2),
          ...badges),
        field("Review text", textIn2, cand.truncated
          ? "Truncated in the copy — click More in Google before copying, or finish the text here."
          : null),
      ];

      let ownerIn2 = null, ownerDateIn2 = null;
      if (cand.ownerResponse) {
        ownerIn2 = el("textarea", { style: "min-height:50px" }); ownerIn2.value = cand.ownerResponse.text || "";
        ownerDateIn2 = el("input", { type: "date" });
        ownerDateIn2.value = cand.ownerResponse.postedAt ? cand.ownerResponse.postedAt.slice(0, 10) : "";
        kids.push(field("Owner response (already posted)", ownerIn2,
          "Preserved verbatim and marked already-posted; never overwritten by AI."));
        kids.push(field("Owner response date", ownerDateIn2));
      }

      previewWrap.append(el("div", { class: "card" }, ...kids));
      rows.push({ cand, check, name: nameIn2, rating: ratingSel, date: dateIn2, text: textIn2, owner: ownerIn2, ownerDate: ownerDateIn2 });
    }
    return rows;
  }

  // Import modal: single manual review (with optional existing owner response),
  // a "Paste HTML from Google" importer, OR a bulk JSON paste. The operator
  // never touches the DB directly.
  function importReviews() {
    const pid = state.projectId;
    const err = el("div", { class: "err" });

    const nameIn = el("input", { type: "text" });
    const ratingIn = el("select", {}, ...[5, 4, 3, 2, 1].map((n) => el("option", { value: n }, `${n}`)));
    const dateIn = el("input", { type: "date" });
    const textIn = el("textarea", {});
    const ownerIn = el("textarea", {});
    const ownerDateIn = el("input", { type: "date" });
    const singleBox = el("div", {},
      field("Reviewer name", nameIn),
      field("Rating", ratingIn),
      field("Review date", dateIn),
      field("Review text", textIn),
      field("Existing owner response (optional)", ownerIn,
        "If this review was already replied to on Google, paste the response here. It is recorded as already-posted and never overwritten by AI."),
      field("Owner response date (optional)", ownerDateIn));

    const bulkIn = el("textarea", {});
    const bulkBox = el("div", { hidden: "" },
      field("Reviews JSON", bulkIn,
        'Paste an array of review objects, or { "reviews": [ ... ] }. Each may include an optional "ownerResponse".'));

    // Paste-HTML-from-Google mode: parse client-side, preview + edit, then import
    // via the same bulk endpoint. `htmlRows` holds the editable row handles.
    const htmlIn = el("textarea", { placeholder: "Paste the copied HTML here" });
    const parseBtn = el("button", { type: "button", class: "sm", text: "Parse" });
    const healthBox = el("div", {});
    const previewWrap = el("div", {});
    let htmlRows = [];
    const htmlBox = el("div", { hidden: "" },
      field("Copied HTML from Google",
        el("div", {}, htmlIn, el("div", { style: "margin-top:6px" }, parseBtn)),
        "In Google/Maps reviews, open DevTools, right-click the reviews container, Copy > Copy element, and paste it here. Click More on long reviews before copying so their full text is included."),
      healthBox, previewWrap);
    parseBtn.addEventListener("click", () => {
      err.textContent = "";
      try { htmlRows = renderHtmlPreview(healthBox, previewWrap, parseGoogleReviewsHtml(htmlIn.value)); }
      catch (ex) { err.textContent = "Could not parse HTML: " + (ex.message || ex); }
    });

    const modeSel = el("select", {
      onchange: () => {
        const m = modeSel.value;
        singleBox.hidden = m !== "single";
        htmlBox.hidden = m !== "html";
        bulkBox.hidden = m !== "bulk";
      },
    }, el("option", { value: "single" }, "Single review"),
       el("option", { value: "html" }, "Paste HTML from Google"),
       el("option", { value: "bulk" }, "Bulk JSON paste"));

    const submitBtn = el("button", { class: "primary", type: "submit", text: "Import" });
    const form = el("form", {},
      field("Mode", modeSel), singleBox, htmlBox, bulkBox, err,
      el("div", { class: "actions" },
        el("button", { type: "button", text: "Cancel", onclick: () => ov.remove() }),
        submitBtn));

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = "";
      submitBtn.disabled = true;
      try {
        let body;
        if (modeSel.value === "bulk") {
          let parsed;
          try { parsed = JSON.parse(bulkIn.value); }
          catch { throw new Error("Invalid JSON"); }
          // Backend accepts { reviews:[...] } or a single object — wrap a bare array.
          body = Array.isArray(parsed) ? { reviews: parsed } : parsed;
        } else if (modeSel.value === "html") {
          const reviews = [];
          for (const row of htmlRows) {
            if (!row.check.checked) continue;
            const name = row.name.value.trim();
            const rating = Number(row.rating.value);
            const text = row.text.value.trim();
            if (!name) throw new Error("A selected review is missing a reviewer name");
            if (!(rating >= 1 && rating <= 5)) throw new Error(`"${name}" needs a rating (1–5)`);
            // Rating-only reviews (no text) are allowed — the backend accepts an
            // empty string and the AI drafts a reply from the star rating.
            const item = { author: { name }, rating, text, source: "google" };
            if (row.cand.externalReviewId) item.externalReviewId = row.cand.externalReviewId;
            if (row.date.value) item.reviewedAt = new Date(row.date.value).toISOString();
            if (row.owner && row.owner.value.trim()) {
              item.ownerResponse = { text: row.owner.value.trim() };
              if (row.ownerDate && row.ownerDate.value) item.ownerResponse.postedAt = new Date(row.ownerDate.value).toISOString();
            }
            reviews.push(item);
          }
          if (!reviews.length) throw new Error("No reviews selected — paste HTML and click Parse first");
          body = { reviews };
        } else {
          if (!nameIn.value.trim()) throw new Error("Reviewer name is required");
          // Review text is optional — a rating-only review is valid.
          body = { author: { name: nameIn.value.trim() }, rating: Number(ratingIn.value), text: textIn.value.trim() };
          if (dateIn.value) body.reviewedAt = new Date(dateIn.value).toISOString();
          if (ownerIn.value.trim()) {
            body.ownerResponse = { text: ownerIn.value.trim() };
            if (ownerDateIn.value) body.ownerResponse.postedAt = new Date(ownerDateIn.value).toISOString();
          }
        }
        const res = await api(`/admin/api/projects/${pid}/reviews`, { method: "POST", body });
        ov.remove();
        const nc = (res.created || []).length, nd = (res.duplicates || []).length;
        alert(`${nc} imported, ${nd} duplicate${nd === 1 ? "" : "s"} skipped`);
        refreshReviewList();
      } catch (ex) { err.textContent = ex.message || "Import failed"; submitBtn.disabled = false; }
    });

    const ov = el("div", { class: "overlay", onclick: (e) => e.target === ov && ov.remove() },
      el("div", { class: "modal" }, el("h2", {}, "Import reviews"), form));
    $("#modal-root").append(ov);
    nameIn.focus();
  }

  // ---------- Approved replies (per-project + global posting queues) ----------
  function renderApproved(col) {
    col.append(
      el("div", { class: "col-head" }, el("span", { class: "title", text: "Approved replies · ready to post" })),
      el("div", { id: "approved-wrap" }));
    loadApproved();
  }

  async function loadApproved() {
    const wrap = $("#approved-wrap");
    if (!wrap) return;
    wrap.replaceChildren(el("div", { class: "empty", text: "Loading…" }));
    let reviews;
    try { reviews = await api(`/admin/api/projects/${state.projectId}/replies/approved`); }
    catch { wrap.replaceChildren(el("div", { class: "empty", text: "Failed to load." })); return; }
    renderApprovedTable(wrap, reviews, false);
  }

  async function selectGlobalApproved() {
    state.view = "global";
    state.projectId = null;
    state.data = null;
    await loadProjects();
    $("#detail-col").replaceChildren();
    $("#mid-col").replaceChildren(
      el("div", { class: "card" },
        el("h3", {}, "All approved replies"),
        el("div", { class: "sub muted", text: "Cross-project queue — approved replies awaiting posting to Google." })),
      el("div", { class: "col-head" }, el("span", { class: "title", text: "Ready to post" })),
      el("div", { id: "approved-wrap" }));
    loadGlobalApproved();
  }

  async function loadGlobalApproved() {
    const wrap = $("#approved-wrap");
    if (!wrap) return;
    wrap.replaceChildren(el("div", { class: "empty", text: "Loading…" }));
    let reviews;
    try { reviews = await api("/admin/api/replies/approved"); }
    catch { wrap.replaceChildren(el("div", { class: "empty", text: "Failed to load." })); return; }
    renderApprovedTable(wrap, reviews, true);
  }

  // Shared table for both queues; `global` adds the client-name column and picks
  // the right refresh after a row is marked posted.
  function renderApprovedTable(wrap, reviews, global) {
    if (!reviews.length) { wrap.replaceChildren(el("div", { class: "empty", text: "Nothing awaiting posting." })); return; }
    const tbody = el("tbody");
    for (const r of reviews) {
      const cells = [];
      if (global) cells.push(el("td", { text: r.projectName || "—" }));
      cells.push(
        el("td", { text: r.author?.name || "—" }),
        el("td", { text: `${r.rating}/5` }),
        el("td", {}, el("div", { style: "max-width:220px", text: r.text || "" })),
        el("td", {}, el("div", { style: "max-width:260px", text: r.reply?.body || "" })),
        el("td", { text: fmtDate(r.approval?.approvedAt) }),
        el("td", {}, el("span", { class: badgeFor(r.publishing?.status), text: r.publishing?.status || "—" })),
        el("td", {},
          el("button", { class: "sm", text: "Copy reply", onclick: () => copyReply(r.reply?.body || "") }), " ",
          el("button", { class: "sm primary", text: "Mark posted", onclick: () => markPostedRow(r, global) })));
      tbody.append(el("tr", {}, ...cells));
    }
    const head = el("tr", {});
    if (global) head.append(el("th", {}, "Client"));
    head.append(
      el("th", {}, "Reviewer"), el("th", {}, "Rating"), el("th", {}, "Review"),
      el("th", {}, "Approved reply"), el("th", {}, "Approved"), el("th", {}, "Posting"), el("th", {}, ""));
    wrap.replaceChildren(el("table", {}, el("thead", {}, head), tbody));
  }

  function copyReply(text) {
    navigator.clipboard.writeText(text).catch(() => {});
  }

  async function markPostedRow(r, global) {
    const note = prompt("Optional note (e.g. 'Posted on Google by hand'):", "");
    if (note === null) return; // cancelled
    try {
      await api(`/admin/api/reviews/${r._id}/mark-posted`, { method: "POST", body: note.trim() ? { note: note.trim() } : {} });
      if (global) loadGlobalApproved(); else loadApproved();
    } catch (ex) { alert(ex.message || "Failed to mark posted"); }
  }

  // ---------- Detail column ----------
  function showTemplate(t) {
    $("#detail-col").replaceChildren(
      el("div", { class: "toolbar" },
        el("button", { class: "sm", text: "Edit", onclick: () => editTemplate(t) }),
        el("button", { class: "sm danger", text: "Delete", onclick: () => deleteTemplate(t) })),
      el("h3", { text: t.name }),
      el("dl", { class: "detail" },
        el("dt", {}, "Format"), el("dd", { text: t.format }),
        el("dt", {}, "Subject"), el("dd", { text: t.subject })),
      el("h4", { text: "Body" }), el("pre", { text: t.body }));
  }

  function showForm(f) {
    $("#detail-col").replaceChildren(
      el("h3", { text: f.name }),
      el("dl", { class: "detail" },
        el("dt", {}, "Form ID"), el("dd", { text: f.formId }),
        el("dt", {}, "Sends to"), el("dd", { text: f.toAddress }),
        el("dt", {}, "Notify tmpl"), el("dd", { text: f.notifyTemplate }),
        el("dt", {}, "Ack tmpl"), el("dd", { text: f.ackTemplate || "(none)" }),
        el("dt", {}, "Origins"), el("dd", { text: (f.allowedOrigins || []).join(", ") || "(any)" }),
        el("dt", {}, "Active"), el("dd", { text: String(f.active) })));
  }

  async function showEmail(id) {
    const col = $("#detail-col");
    col.replaceChildren(el("div", { class: "empty", text: "Loading…" }));
    let e;
    try { e = await api("/admin/api/emails/" + id); } catch { return; }
    const blocks = [el("div", { class: "toolbar" },
      el("button", { class: "sm danger", text: "Delete", onclick: () => deleteEmail(e) })),
      el("div", { class: "detail" }, el("h3", { text: "Email" }),
      el("dl", {},
        el("dt", {}, "To"), el("dd", { text: e.to }),
        el("dt", {}, "From"), el("dd", { text: e.from }),
        el("dt", {}, "Reply-To"), el("dd", { text: e.replyTo || "—" }),
        el("dt", {}, "Status"), el("dd", {}, el("span", { class: "badge " + e.status, text: e.status })),
        el("dt", {}, "Attempts"), el("dd", { text: `${e.attempts} / ${e.maxAttempts}` }),
        el("dt", {}, "Provider"), el("dd", { text: e.provider || "—" }),
        el("dt", {}, "Template"), el("dd", { text: e.templateName || "(raw)" }),
        el("dt", {}, "Created"), el("dd", { text: fmtDate(e.createdAt) }),
        el("dt", {}, "Sent"), el("dd", { text: fmtDate(e.sentAt) })))];
    if (e.lastError) blocks.push(el("h4", { text: "Last error" }), el("pre", { text: e.lastError }));
    if (e.subject) blocks.push(el("h4", { text: "Subject" }), el("pre", { text: e.subject }));
    if (e.variables) blocks.push(el("h4", { text: "Variables" }), el("pre", { text: JSON.stringify(e.variables, null, 2) }));
    if (e.markdown) blocks.push(el("h4", { text: "Markdown body" }), el("pre", { text: e.markdown }));
    if (e.html) blocks.push(el("h4", { text: "HTML body" }), el("pre", { text: e.html }));
    if (e.text) blocks.push(el("h4", { text: "Text body" }), el("pre", { text: e.text }));
    col.replaceChildren(...blocks);
  }

  // Probe the API first: if it returns 200 (no token required, or a valid one is
  // stored) we skip the gate and go straight to the dashboard; a 401 shows the gate.
  async function boot() {
    try { await api("/admin/api/projects"); }
    catch { unlock(false); return; }
    unlock(true); loadProjects(); checkHealth();
  }
  boot();
})();
</script>
