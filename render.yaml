# Render Blueprint — deploys the email-service web service. Use MongoDB Atlas
# for the database (Render's free tier has no managed Mongo).
#
# One-click: push this repo, then in Render: New > Blueprint, pick this repo.
# You'll be prompted for MONGODB_URI and the SES/Brevo SMTP secrets.
#
# NOTE: on the free plan (1) the instance sleeps after ~15 min idle, which
# pauses the in-process send worker until the next request wakes it, and
# (2) outbound SMTP on 25/465/587 is blocked — use SES port 2587 (below).
# Upgrade the plan if you need 587 or guaranteed prompt sends while idle.
services:
  - type: web
    name: email-service
    runtime: node
    plan: free
    region: oregon
    # --include=dev is required because NODE_ENV=production (below) otherwise makes
    # npm skip devDependencies — but the build needs typescript + @types/node.
    # Runtime (npm start) only uses compiled dist/ + production deps.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    buildFilter:
      paths:
        - src/**
        - public/**
        - package.json
        - package-lock.json
        - tsconfig.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Paste your MongoDB Atlas connection string when prompted.
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        value: "*"
      # Shared secret to unlock the /admin dashboard. Set this to a long random
      # value and keep it private — anyone with it can read all send history.
      - key: ADMIN_TOKEN
        sync: false
      # OpenAI — powers review analysis + reply drafting. Leave the key unset to
      # run on the deterministic mock; set it to enable live completions.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # Google Business Profile — review sync + "Post to Google". Optional; leave
      # unset to disable. Redirect URI = https://<service-host>/admin/google/callback
      # and must match the Web-application OAuth client in Google Cloud.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      # openssl rand -hex 32. Rotating it requires reconnecting Google.
      - key: GOOGLE_TOKEN_ENCRYPTION_KEY
        sync: false
      # Minutes between scheduled syncs; 0 disables the scheduler.
      - key: REVIEW_SYNC_INTERVAL_MINUTES
        value: "360"
      # SES SMTP (primary). Host is region-specific; user/pass are IAM SMTP creds.
      # 2587 is SES's STARTTLS alternate — Render free blocks 25/465/587.
      - key: SES_SMTP_HOST
        value: email-smtp.us-east-1.amazonaws.com
      - key: SES_SMTP_PORT
        value: "2587"
      - key: SES_SMTP_USER
        sync: false
      - key: SES_SMTP_PASS
        sync: false
      # Brevo SMTP (failover). Optional — leave blank to run SES-only.
      - key: BREVO_SMTP_HOST
        value: smtp-relay.brevo.com
      - key: BREVO_SMTP_PORT
        value: "587"
      - key: BREVO_SMTP_USER
        sync: false
      - key: BREVO_SMTP_PASS
        sync: false
